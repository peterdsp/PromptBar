<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>404 — PromptBar</title>
    <link rel="icon" type="image/png" href="/assets/appicon-128.png" />

      html, body { background: #07070c; color: #e8e8f0; margin: 0; height: 100%; }

        display: grid; place-items: center; text-align: center; padding: 2rem;
      }
      .card {
        max-width: 520px;
        padding: 2.5rem;
        border-radius: 24px;
        border: 1px solid rgba(255,255,255,0.08);
        background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
        backdrop-filter: blur(24px);
      }
      h1 { font-size: 2.25rem; margin: 0 0 .5rem; letter-spacing: -0.02em; }
      p { color: #a1a1aa; margin: 0 0 1.5rem; }
      a {
        display: inline-block; padding: .7rem 1.2rem; border-radius: 12px;
        background: linear-gradient(180deg, #38bdf8, #0ea5e9); color: #05161f;
        text-decoration: none; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/assets/appicon-128.png" alt="" style="width:64px;height:64px;border-radius:14px;margin-bottom:1rem;" />
