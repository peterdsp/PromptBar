name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  SCHEME: PromptBar
  PROJECT: PromptBar/PromptBar.xcodeproj

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      # ── Static Analysis ───────────────────────────────────────────
      - name: Build Debug (with warnings as errors)
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES

      # ── Release Build ─────────────────────────────────────────────
      - name: Build Release
        run: |
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO

      # ── Verify App Bundle ─────────────────────────────────────────
      - name: Verify app bundle structure
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "PromptBar.app" -path "*/Release/*" | head -1)

          if [ -z "$APP" ]; then
            echo "::error::PromptBar.app not found in build output"
            exit 1
          fi

          echo "Found app at: $APP"

          # Check the binary exists
          if [ ! -f "$APP/Contents/MacOS/PromptBar" ]; then
            echo "::error::Missing main binary"
            exit 1
          fi

          # Check Info.plist exists
          if [ ! -f "$APP/Contents/Info.plist" ]; then
            echo "::error::Missing Info.plist"
            exit 1
          fi

          # Check required resources
          if [ ! -f "$APP/Contents/Resources/Assets.car" ]; then
            echo "::error::Missing compiled assets"
            exit 1
          fi

          # Check the binary links against expected frameworks
          LINKED=$(otool -L "$APP/Contents/MacOS/PromptBar")
          for fw in WebKit AppKit SwiftUI; do
            if ! echo "$LINKED" | grep -q "$fw"; then
              echo "::error::Binary not linked against $fw"
              exit 1
            fi
          done

          echo "App bundle validation passed"

      # ── Smoke Test ────────────────────────────────────────────────
      - name: Smoke test (launch and quit)
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name "PromptBar.app" -path "*/Release/*" | head -1)

          # The app targets macOS 26 (LSMinimumSystemVersion). Launch Services
          # refuses to launch it on an older runner (error -10825), which is an
          # environment limitation, not an app defect. Skip the runtime launch
          # when the runner OS is older than the app's minimum; still run it on
          # a capable runner so crash-on-startup is caught.
          MIN=$(/usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist" 2>/dev/null || echo "0")
          OS=$(sw_vers -productVersion)
          if [ "$(printf '%s\n%s\n' "$MIN" "$OS" | sort -V | head -1)" != "$MIN" ]; then
            echo "::warning::Runner macOS $OS is older than app minimum $MIN; skipping runtime launch check."
            exit 0
          fi

          # Launch the app in background, give it a few seconds, then check it's running
          open "$APP"
          sleep 5

          if pgrep -x "PromptBar" > /dev/null; then
            echo "App launched successfully"
            pkill -x "PromptBar"
            echo "App terminated cleanly"
          else
            echo "::error::App failed to launch or crashed on startup"
            exit 1
          fi

  # PromptBarTests exists in the project and passes, but nothing in CI ran it, so
  # the suite could rot without anyone noticing. It is a standalone logic bundle
  # (no TEST_HOST, no BUNDLE_LOADER), so it does not need to launch the app.
  #
  # It does need a runner that can load a macOS 26 binary, because both the app
  # and the test bundle have MACOSX_DEPLOYMENT_TARGET 26.0. That is why this job
  # is on macos-26 rather than the macos-15 the validate job uses: on an older
  # runner the test bundle would fail to load, which would look like a test
  # failure and is not one.
  unit-tests:
    name: Unit tests
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          set -euo pipefail
          newest="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$newest" ]; then
            echo "::error::No Xcode found on this runner image."
            exit 1
          fi
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
