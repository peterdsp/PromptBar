name: Package App Store (Apple Distribution)

# Standalone, narrowly scoped packaging for the Mac App Store channel.
# Builds a sandboxed, Apple-Distribution-signed .pkg WITHOUT the
# EXTERNAL_DISTRIBUTION flag, then validates and uploads to App Store Connect.
# It is a SEPARATE artifact from the Developer ID / Ko-fi ZIP and must never be
# attached to a public GitHub Release. It does not create a release.
#
# Required repository secrets (NOT yet configured; the run fails fast until set):
#   APPLE_DISTRIBUTION_P12_BASE64         base64 of the Apple Distribution .p12
#   MAC_INSTALLER_DISTRIBUTION_P12_BASE64 base64 of the 3rd Party Mac Developer
#                                         Installer .p12
#   CERTS_P12_PASSWORD                    password for both .p12 files
#   CI_KEYCHAIN_PASSWORD                  temp keychain password
#   ASC_KEY_ID / ASC_ISSUER_ID            App Store Connect API key identifiers
#   ASC_API_KEY_BASE64                    base64 of the AuthKey_XXXX.p8

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Immutable git ref (tag/commit) to build."
        required: true
        default: "v2.2.0"
      upload:
        description: "Upload to App Store Connect (true) or validate only (false)."
        required: true
        default: "false"

permissions:
  contents: read

env:
  SCHEME: PromptBar
  PROJECT: PromptBar/PromptBar.xcodeproj
  CONFIGURATION: Release
  TEAM_ID: YTS4KJBX3P

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      KEYCHAIN_PASSWORD: ${{ secrets.CI_KEYCHAIN_PASSWORD }}
      CERTS_P12_PASSWORD: ${{ secrets.CERTS_P12_PASSWORD }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - name: Checkout immutable ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Preflight - required secrets present
        run: |
          missing=0
          for s in APPLE_DISTRIBUTION_P12_BASE64 MAC_INSTALLER_DISTRIBUTION_P12_BASE64 \
                   CERTS_P12_PASSWORD CI_KEYCHAIN_PASSWORD ASC_KEY_ID ASC_ISSUER_ID \
                   ASC_API_KEY_BASE64; do
            if [ -z "${!s:-}" ]; then echo "::error::Missing secret: $s"; missing=1; fi
          done
          [ "$missing" = "0" ] || { echo "Configure the App Store secrets, then re-run."; exit 1; }
        env:
          APPLE_DISTRIBUTION_P12_BASE64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          MAC_INSTALLER_DISTRIBUTION_P12_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_P12_BASE64 }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Show toolchain and source identity
        run: |
          xcodebuild -version
          echo "Resolved commit: $(git rev-parse HEAD)"
          grep -E 'MARKETING_VERSION|CURRENT_PROJECT_VERSION|PRODUCT_BUNDLE_IDENTIFIER' \
            "$PROJECT/project.pbxproj" | sort -u | head

      - name: Resolve SPM dependencies
        run: xcodebuild -resolvePackageDependencies -project "$PROJECT" -scheme "$SCHEME"

      - name: Define temp keychain path
        run: echo "KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db" >> "$GITHUB_ENV"

      - name: Set up signing keychain (Apple Distribution + Mac Installer)
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "${KEYCHAIN_PATH}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "${KEYCHAIN_PATH}"

          echo "${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}" | base64 -d > "$RUNNER_TEMP/dist.p12"
          echo "${{ secrets.MAC_INSTALLER_DISTRIBUTION_P12_BASE64 }}" | base64 -d > "$RUNNER_TEMP/installer.p12"

          security import "$RUNNER_TEMP/dist.p12" \
            -k "${KEYCHAIN_PATH}" -P "$CERTS_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security import "$RUNNER_TEMP/installer.p12" \
            -k "${KEYCHAIN_PATH}" -P "$CERTS_P12_PASSWORD" \
            -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/security

          security list-keychains -d user -s "${KEYCHAIN_PATH}"
          security default-keychain -s "${KEYCHAIN_PATH}"
          security set-key-partition-list -S apple-tool:,apple:,unsigned: -s -k "$KEYCHAIN_PASSWORD" "${KEYCHAIN_PATH}"

          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/installer.p12"
          security find-identity -v "${KEYCHAIN_PATH}"

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "${{ secrets.ASC_API_KEY_BASE64 }}" | base64 -d > "$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Build, validate, and (optionally) upload
        run: |
          if [ "${{ github.event.inputs.upload }}" = "true" ]; then export UPLOAD=1; fi
          ./scripts/build-appstore.sh

      - name: Clean up signing keychain
        if: always()
        run: security delete-keychain "${KEYCHAIN_PATH}" || true
